<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0d10" />
		<title>Offline — Cerebro Sport</title>
		<style>
			:root {
				--bg: #0a0c0f;
				--text: #e8edf3;
				--muted: #97a3b2;
				--accent: #c9f227;
				--accent-ink: #0a0c0f;
			}
			@media (prefers-color-scheme: light) {
				:root {
					--bg: #f4f6f8;
					--text: #0e141b;
					--muted: #56626f;
					--accent: #b5e114;
					--accent-ink: #10160b;
				}
			}
			* { box-sizing: border-box; }
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px 16px;
				background: var(--bg);
				color: var(--text);
				font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
				text-align: center;
			}
			main { max-width: 22rem; }
			h1 { font-size: 20px; margin: 0 0 6px; }
			p { color: var(--muted); margin: 0 0 20px; }
			a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 44px;
				padding: 0 20px;
				border-radius: 12px;
				background: var(--accent);
				color: var(--accent-ink);
				font-weight: 600;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<!-- Served by the service worker for a page that was never saved for offline use. -->
		<main>
			<h1>Not available offline yet</h1>
			<p>This page has not been opened online on this device. Today, your library and your metrics are.</p>
			<a href="/">Back to today</a>
		</main>
	</body>
</html>
