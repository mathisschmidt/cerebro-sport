# Builds the image and runs it. One service, two volumes, nothing else.
#
# Portainer: deploy this as a stack from the Git repository — "Repository" as
# the build method, not the web editor. A pasted compose file has no source
# tree, so `build:` below has nothing to build from. Set the variables under
# the stack's Environment section.
#
# Plain compose:
#   cp .env.production.example .env && $EDITOR .env
#   docker compose up -d --build
#
# The app serves plain HTTP. Put your own reverse proxy in front of it if you
# are exposing it to the internet.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cerebro-sport:latest
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      # The database lives on the volume, not in the image.
      DATABASE_URL: /data/app.db

      # Signs session cookies. No default on purpose — the app refuses to serve
      # without it in production. Generate with: openssl rand -base64 32
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?required — generate with `openssl rand -base64 32`}

      # The public URL, scheme included, no trailing slash. SvelteKit builds
      # absolute URLs from this and cannot infer it behind a proxy.
      ORIGIN: ${ORIGIN:?required — the public URL, e.g. https://training.example.com}
      # Pins the auth origin too, instead of deriving it per request.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${ORIGIN}}

      # First boot only; ignored once the account exists.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}

    volumes:
      # The SQLite file. Losing this loses everything.
      - cerebro-sport-data:/data
      # Where `node scripts/backup.mjs /backups` writes.
      - cerebro-sport-backups:/backups

    # Published on every interface so a phone on the same network can reach it.
    # Set BIND_ADDRESS=127.0.0.1 if a reverse proxy on this host is the only
    # thing that should talk to it.
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000'

    # The image defines the check; this repeats it so the stack reacts to it.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

# SQLite is a single writer against a single file — never scale this service
# past one replica, and never point two stacks at the same volume.
volumes:
  cerebro-sport-data:
  cerebro-sport-backups:
